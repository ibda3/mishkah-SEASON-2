                                                    {/* Direction Toggle */}
                                                    <button
                                                        onClick={() => setPart5Direction(prev => ({
                                                            ...prev,
                                                            [pNum]: (prev[pNum] || 1) === 1 ? -1 : 1
                                                        }))}
                                                        className={`w-full py-0.5 rounded text-[11px] font-black border transition-all cursor-pointer ${
                                                            p5Dir === 1 
                                                                ? 'bg-studio-emerald/20 border-studio-emerald text-studio-emerald' 
                                                                : 'bg-studio-rose/20 border-studio-rose text-studio-rose'
                                                        }`}
                                                    >
                                                        {p5Dir === 1 ? '+ إضافة نقاط' : '− خصم نقاط'}
                                                    </button>

                                                    {/* 3 Step Buttons: 5 / 10 / 20 */}
                                                    <div className="grid grid-cols-3 gap-1 pt-0.5">
                                                        {[5, 10, 20].map(step => {
                                                            const deltaPts = p5Dir * step;
                                                            return (
                                                                <button
                                                                    key={step}
                                                                    onClick={() => handleScoreChange(
                                                                        `p5-${step}-${pNum}`,
                                                                        'addSeg5',
                                                                        `&playerId=${pNum}&points=${deltaPts}`,
                                                                        `تعديل ف5 (${deltaPts > 0 ? '+' : ''}${deltaPts}) للمتسابق (${pName})`,
                                                                        'addSeg5',
                                                                        `&playerId=${pNum}&points=${-deltaPts}`
                                                                    )}
                                                                    className={`min-h-[28px] rounded text-xs font-black cursor-pointer transition-all ${
                                                                        p5Dir === 1 
                                                                            ? 'bg-studio-elevated hover:bg-studio-emerald hover:text-white text-studio-text border border-white/5' 
                                                                            : 'bg-studio-elevated hover:bg-studio-rose hover:text-white text-studio-rose border border-white/5'
                                                                    }`}
                                                                >
                                                                    {btnFeedback[`p5-${step}-${pNum}`] ? '✓' : step}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* 5. COLLAPSIBLE PROGRESSIVE DISCLOSURE DRAWER */}
                    {isDrawerOpen && (
                        <div className="fixed inset-0 z-50 drawer-overlay flex justify-end">
                            <div className="w-full max-w-xl bg-studio-surface border-r border-white/10 h-full p-6 flex flex-col justify-between overflow-y-auto animate-fade-in shadow-2xl">
                                <div className="space-y-6">
                                    {/* Drawer Header */}
                                    <div className="flex items-center justify-between border-b border-white/5 pb-4">
                                        <h3 className="text-lg font-black text-white flex items-center gap-2">
                                            <span>أدوات البث والإعدادات</span>
                                        </h3>
                                        <button
                                            onClick={() => setIsDrawerOpen(false)}
                                            className="w-8 h-8 rounded-lg bg-studio-elevated text-studio-muted hover:text-white flex items-center justify-center cursor-pointer"
                                        >
                                            <Icons.Close />
                                        </button>
                                    </div>

                                    {/* Drawer Nav Tabs */}
                                    <div className="flex gap-2 p-1 bg-studio-base rounded-xl">
                                        {[
                                            { key: 'vmix', label: 'روابط vMix' },
                                            { key: 'names', label: 'أسماء المتسابقين' },
                                            { key: 'questions', label: 'بنك الأسئلة' },
                                            { key: 'scenes', label: 'مشاهد vMix' }
                                        ].map(t => (
                                            <button
                                                key={t.key}
                                                onClick={() => setDrawerTab(t.key)}
                                                className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                                                    drawerTab === t.key 
                                                        ? 'bg-studio-gold text-studio-base font-black' 
                                                        : 'text-studio-muted hover:text-white'
                                                }`}
                                            >
                                                {t.label}
                                            </button>
                                        ))}
                                    </div>

                                    {/* TAB 1: vMix Live Links */}
                                    {drawerTab === 'vmix' && (
                                        <div className="space-y-4">
                                            <div className="p-3.5 bg-studio-elevated rounded-xl text-xs text-studio-muted leading-relaxed">
                                                انسخ الرابط التالي وضعه في <strong>vMix → Data Sources</strong> مع تفعيل التحديث التلقائي كل <strong>500 ms</strong>:
                                            </div>

                                            {[
                                                {
                                                    key: 'results',
                                                    title: 'شيت النتائج المباشر (Results CSV)',
                                                    url: vmixUrls.resultsCsv || `${window.location.origin}/api/vmix/results.csv`
                                                },
                                                {
                                                    key: 'status',
                                                    title: 'شيت إجابات الأسئلة (Status CSV)',
                                                    url: vmixUrls.statusCsv || `${window.location.origin}/api/vmix/status.csv`
                                                },
                                                {
                                                    key: 'liveJson',
                                                    title: 'رابط البيانات المباشر (Web JSON)',
                                                    url: vmixUrls.liveJson || `${window.location.origin}/api/vmix/live.json`
                                                }
                                            ].map(item => (
                                                <div key={item.key} className="card-surface p-3.5 space-y-2">
                                                    <span className="text-xs font-bold text-white">{item.title}</span>
                                                    <div className="flex gap-2">
                                                        <input
                                                            type="text"
                                                            readOnly
                                                            value={item.url}
                                                            dir="ltr"
                                                            className="flex-1 p-2 bg-studio-base border border-white/5 rounded-lg text-xs font-mono text-studio-gold outline-none"
                                                        />
                                                        <button
                                                            onClick={() => copyUrl(item.key, item.url)}
                                                            className="px-3 py-2 bg-studio-gold hover:bg-studio-goldHover text-studio-base rounded-lg text-xs font-bold cursor-pointer shrink-0"
                                                        >
                                                            {copiedKey === item.key ? 'تم ✓' : 'نسخ'}
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* TAB 2: Names Editor */}
                                    {drawerTab === 'names' && (
                                        <div className="space-y-4">
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs text-studio-muted">تعديل أسماء المتسابقين الـ 8:</span>
                                                <button
                                                    onClick={resetNamesDefault}
                                                    className="text-xs text-studio-gold hover:underline cursor-pointer"
                                                >
                                                    استعادة الافتراضية
                                                </button>
                                            </div>

                                            <div className="grid grid-cols-2 gap-2.5">
                                                {[0, 1, 2, 3, 4, 5, 6, 7].map(idx => (
                                                    <div key={idx} className="space-y-1">
                                                        <label className="text-[11px] text-studio-muted block">المقعد {idx + 1}</label>
                                                        <input
                                                            type="text"
                                                            value={namesEdit[idx] !== undefined ? namesEdit[idx] : ""}
                                                            onChange={e => {
                                                                const next = [...namesEdit];
                                                                next[idx] = e.target.value;
                                                                setNamesEdit(next);
                                                            }}
                                                            className="w-full p-2 bg-studio-base border border-white/10 rounded-lg text-white font-bold text-xs outline-none focus:border-studio-gold"
                                                        />
                                                    </div>
                                                ))}
                                            </div>

                                            <button
                                                onClick={() => saveNames()}
                                                disabled={loading}
                                                className="w-full min-h-[44px] bg-studio-gold hover:bg-studio-goldHover text-studio-base font-bold rounded-xl text-sm cursor-pointer shadow-md"
                                            >
                                                حفظ وتحديث الأسماء فوراً
                                            </button>
                                        </div>
                                    )}

                                    {/* TAB 3: Questions Bank */}
                                    {drawerTab === 'questions' && (
                                        <div className="space-y-4">
                                            <div
                                                onClick={() => fileInputRef.current?.click()}
                                                className="border-2 border-dashed border-studio-gold/30 hover:border-studio-gold rounded-2xl p-6 text-center cursor-pointer transition-all bg-studio-base"
                                            >
                                                <input
                                                    type="file"
                                                    ref={fileInputRef}
                                                    accept=".xlsx, .xls, .csv"
                                                    onChange={handleExcelUpload}
                                                    className="hidden"
                                                />
                                                <div className="w-12 h-12 rounded-xl bg-studio-goldMuted text-studio-gold flex items-center justify-center mx-auto mb-2">
                                                    <Icons.Upload />
                                                </div>
                                                <div className="text-sm font-bold text-white">
                                                    {uploadFileName ? `تم اختيار: ${uploadFileName}` : "اختر ملف Excel أو CSV"}
                                                </div>
                                                <div className="text-xs text-studio-muted mt-1">الأعمدة: Question, A, B, C, D, Correct</div>
                                            </div>

                                            {parsedQuestions.length > 0 && (
                                                <div className="space-y-3">
                                                    <div className="text-sm font-bold text-studio-emerald">
                                                        ✓ تم قراءة {parsedQuestions.length} سؤال بنجاح
                                                    </div>
                                                    <button
                                                        onClick={commitQuestions}
                                                        disabled={loading}
                                                        className="w-full min-h-[44px] bg-studio-gold hover:bg-studio-goldHover text-studio-base font-black rounded-xl text-sm cursor-pointer"
                                                    >
                                                        اعتماد وحفظ بنك الأسئلة
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* TAB 4: vMix Scenes */}
                                    {drawerTab === 'scenes' && (
                                        <div className="space-y-3">
                                            <span className="text-xs text-studio-muted block">اختر جدول المشهد النشط لمخرج vMix:</span>
                                            {[
                                                { key: 'seg1', label: 'الفقرة 1 (اختر صح)' },
                                                { key: 'seg2', label: 'الفقرة 2 (آيات بينات)' },
                                                { key: 'seg3', label: 'الفقرة 3 (اختر بابك)' },
                                                { key: 'seg4', label: 'الفقرة 4 (التحدي البصري)' },
                                                { key: 'seg5', label: 'الفقرة 5 (من أكون؟)' },
                                                { key: 'total', label: '🏆 النتائج الكلية لجميع الفقرات', gold: true },
                                            ].map(v => (
                                                <button
                                                    key={v.key}
                                                    onClick={() => performAction('setView', `&view=${v.key}`)}
                                                    className={`w-full p-3 rounded-xl text-sm font-bold transition-all text-right cursor-pointer ${
                                                        v.gold 
                                                            ? 'bg-studio-gold text-studio-base font-black' 
                                                            : 'card-surface hover:bg-studio-elevated text-white'
                                                    }`}
                                                >
                                                    {v.label}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="pt-4 border-t border-white/5">
                                    <button
                                        onClick={() => setIsDrawerOpen(false)}
                                        className="w-full py-2.5 bg-studio-elevated text-studio-muted hover:text-white rounded-xl text-xs font-bold cursor-pointer"
                                    >
                                        إغلاق اللوحة
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Safe Stop Contest Confirmation Modal */}
                    {showStopConfirm && (
                        <div className="fixed inset-0 z-50 drawer-overlay flex items-center justify-center p-4">
                            <div className="card-surface p-6 sm:p-8 max-w-sm w-full space-y-4 text-center">
                                <h3 className="text-lg font-bold text-white">إيقاف المسابقة والعودة للاستعداد؟</h3>
                                <p className="text-xs text-studio-muted leading-relaxed">
                                    سيتم إغلاق استقبال الإجابات وإيقاف البث لتابلت المتسابقين.
                                </p>
                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <button
                                        onClick={() => setShowStopConfirm(false)}
                                        className="py-2.5 rounded-xl bg-studio-elevated text-white text-xs font-bold cursor-pointer"
                                    >
                                        إلغاء
                                    </button>
                                    <button
                                        onClick={() => toggleGameStatus(false)}
                                        className="py-2.5 rounded-xl bg-studio-rose text-white text-xs font-bold cursor-pointer"
                                    >
                                        تأكيد الإيقاف
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Custom Score Modal */}
                    {customModalPid && (
                        <div className="fixed inset-0 z-50 drawer-overlay flex items-center justify-center p-4">
                            <div className="card-surface p-6 max-w-xs w-full space-y-4">
                                <h3 className="text-sm font-bold text-white">
                                    نقاط للمتسابق {customModalPid} ({playerNames[customModalPid - 1]})
                                </h3>
                                <input
                                    type="number"
                                    value={customPointsInput}
                                    onChange={e => setCustomPointsInput(e.target.value)}
                                    autoFocus
                                    className="w-full p-3 bg-studio-base border border-studio-gold/40 rounded-xl text-studio-gold font-mono font-black text-center text-3xl outline-none"
                                />
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => setCustomModalPid(null)} className="py-2 rounded-lg bg-studio-elevated text-white text-xs font-bold cursor-pointer">
                                        إلغاء
                                    </button>
                                    <button
                                        onClick={() => {
                                            if (customPointsInput) {
                                                performAction('addSeg5', `&playerId=${customModalPid}&points=${customPointsInput}`);
                                            }
                                            setCustomModalPid(null);
                                        }}
                                        className="py-2 rounded-lg bg-studio-gold text-studio-base font-bold text-xs cursor-pointer"
                                    >
                                        تأكيد
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 3-Second Undo Toast for Score Changes */}
                    {undoToast && (
                        <div className="fixed bottom-6 left-6 z-50 animate-fade-in flex items-center gap-4 bg-studio-surface border-2 border-studio-gold p-4 rounded-2xl shadow-2xl">
                            <div className="flex items-center gap-2 text-sm font-bold text-white">
                                <span className="w-2.5 h-2.5 rounded-full bg-studio-emerald animate-pulse"></span>
                                <span>{undoToast.desc}</span>
                            </div>
                            <button
                                onClick={undoToast.undo}
                                className="px-4 py-1.5 rounded-xl bg-studio-rose text-white hover:bg-rose-600 text-xs font-black flex items-center gap-1.5 cursor-pointer shadow active:scale-95 transition-all"
                            >
                                <Icons.Undo />
                                <span>تراجع (Undo)</span>
                            </button>
                        </div>
                    )}

                    {/* Toast Alert */}
                    {scoreNotice && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-studio-elevated border border-studio-gold/60 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-bold animate-fade-in">
                            <span className="text-studio-gold">💡</span>
                            <span>{scoreNotice}</span>
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // 3. ENTRY PORTAL (Clean 8-Seat Grid + Director)
        // ==========================================
        const SetupView = ({ onGo, isLocal, setIsLocal, url, setUrl, playerNames = [] }) => {
            const [showPassModal, setShowPassModal] = useState(false);
            const [pass, setPass] = useState("");

            const handleGo = (role, playerId) => {
                if (!isLocal && !url) {
                    alert("يرجى إدخال رابط Google Script أو تفعيل الوضع المحلي");
                    return;
                }
                onGo(url, role, playerId);
            };

            return (
                <div className="max-w-5xl mx-auto py-8 px-4 sm:px-6 space-y-8 animate-fade-in">
                    {/* Centered Brand Mark */}
                    <div className="text-center space-y-2">
                        <div className="w-16 h-16 rounded-2xl bg-studio-gold text-studio-base font-amiri font-bold text-4xl flex items-center justify-center mx-auto shadow-lg">
                            م
                        </div>
                        <h1 className="text-3xl font-black text-white">مسابقة مشكاة</h1>
                        <p className="text-studio-muted text-sm">منصة البث التلفزيوني والربط اللحظي مع برنامج vMix</p>
                    </div>

                    {/* Local Connection Toggle Card */}
                    <div className="card-surface p-4 flex items-center justify-between gap-4 max-w-xl mx-auto">
                        <div className="flex items-center gap-3">
                            <span className={`w-3 h-3 rounded-full ${isLocal ? 'bg-studio-emerald animate-pulse' : 'bg-studio-muted'}`}></span>
                            <div>
                                <div className="text-sm font-bold text-white">
                                    {isLocal ? 'الخادم المحلي المباشر (vMix)' : 'الوضع السحابي (Google Sheets)'}
                                </div>
                                <div className="text-xs text-studio-muted">
                                    {isLocal ? 'اتصال داخلي فائق السرعة بدون إنترنت وبدون تأخير' : 'ربط عبر الإنترنت'}
                                </div>
                            </div>
                        </div>

                        <button
                            onClick={() => setIsLocal(!isLocal)}
                            className={`min-h-[36px] px-3.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                                isLocal ? 'bg-studio-emerald/20 text-studio-emerald border border-studio-emerald/40' : 'bg-studio-elevated text-studio-muted'
                            }`}
                        >
                            {isLocal ? 'متصل محلياً' : 'تبديل للمحلي'}
                        </button>
                    </div>

                    {/* Role Selection: Grid of 8 Contestant Seats + Director Card */}
                    <div className="space-y-4">
                        <div className="flex items-center justify-between">
                            <span className="text-sm font-bold text-white">اختر مقعد المتسابق أو غرفة المخرج للدخول:</span>
                            <span className="text-xs text-studio-muted">8 مقاعد مجهزة للمسرح</span>
                        </div>

                        {/* Top: Director Card */}
                        <div
                            onClick={() => setShowPassModal(true)}
                            className="card-surface hover:bg-studio-elevated border-studio-gold/30 hover:border-studio-gold p-5 rounded-2xl flex items-center justify-between gap-4 cursor-pointer transition-all shadow-md group"
                        >
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 rounded-xl bg-studio-gold text-studio-base flex items-center justify-center font-bold">
                                    <Icons.Tv />
                                </div>
                                <div>
                                    <div className="text-base font-extrabold text-white group-hover:text-studio-gold transition-colors">
                                        غرفة مخرج المسابقة (Director Control Room)
                                    </div>
                                    <div className="text-xs text-studio-muted">
                                        لوحة التحكم الشاملة، المؤقت، رصد الإجابات، والربط مع vMix
                                    </div>
                                </div>
                            </div>
                            <span className="text-xs font-bold text-studio-gold bg-studio-goldMuted px-3 py-1.5 rounded-lg">
                                الدخول بكلمة المرور ←
                            </span>
                        </div>

                        {/* Grid of 8 Seat Cards */}
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
                            {[1, 2, 3, 4, 5, 6, 7, 8].map(n => {
                                const rawName = playerNames?.[n - 1];
                                const contestantName = (rawName && rawName.trim()) ? rawName.trim() : `المتسابق ${n}`;
                                return (
                                    <button
                                        key={n}
                                        onClick={() => handleGo('PLAYER', n)}
                                        className="card-surface hover:bg-studio-elevated border-white/5 hover:border-studio-gold/50 p-4 rounded-xl flex flex-col items-center justify-center text-center space-y-2 cursor-pointer transition-all active:scale-[0.98] group"
                                    >
                                        <div className="w-10 h-10 rounded-xl bg-studio-elevated group-hover:bg-studio-gold text-studio-gold group-hover:text-studio-base font-black font-mono text-base flex items-center justify-center transition-colors">
                                            {n}
                                        </div>
                                        <div className="text-sm font-bold text-white group-hover:text-studio-gold transition-colors truncate w-full">
                                            {contestantName}
                                        </div>
                                        <div className="text-[11px] text-studio-muted">المقعد {n}</div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Password Modal for Director */}
                    {showPassModal && (
                        <div className="fixed inset-0 z-50 drawer-overlay flex items-center justify-center p-4">
                            <div className="card-surface p-6 sm:p-8 max-w-xs w-full space-y-4 text-center animate-fade-in">
                                <h3 className="text-sm font-bold text-studio-gold">كلمة مرور غرفة المخرج</h3>
                                <input
                                    type="password"
                                    value={pass}
                                    onChange={e => setPass(e.target.value)}
                                    placeholder="••••"
                                    autoFocus
                                    onKeyDown={e => e.key === 'Enter' && (pass === ADMIN_PASSWORD ? handleGo('ADMIN') : alert("كلمة المرور غير صحيحة"))}
                                    className="w-full p-3.5 bg-studio-base border border-white/10 rounded-xl text-center text-2xl font-mono text-studio-gold outline-none focus:border-studio-gold tracking-widest"
                                />
                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        onClick={() => setShowPassModal(false)}
                                        className="py-2.5 rounded-lg bg-studio-elevated text-studio-muted hover:text-white text-xs font-bold cursor-pointer"
                                    >
                                        إلغاء
                                    </button>
                                    <button
                                        onClick={() => pass === ADMIN_PASSWORD ? handleGo('ADMIN') : alert("كلمة المرور غير صحيحة")}
                                        className="py-2.5 rounded-lg bg-studio-gold hover:bg-studio-goldHover text-studio-base text-xs font-black cursor-pointer"
                                    >
                                        تأكيد الدخول
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // 4. APP SHELL
        // ==========================================
        const App = () => {
            const [mode, setMode] = useState('SETUP');
            const [url, setUrl] = useState('');
            const [pId, setPId] = useState(null);
            const [isLocal, setIsLocal] = useState(true);
            const [playerNames, setPlayerNames] = useState([
                "سمية أمير", "أسماء دليل", "لينة بن ناجي", "بسمة حلاب",
                "أيوب مصري", "أسامة الوناس", "زيد كموش", "راشدي ياسين"
            ]);

            const fetchNames = async () => {
                try {
                    const res = await fetch('/api/getStatus');
                    const json = await res.json();
                    if (json.success && json.data?.playerNames?.length) {
                        setPlayerNames(json.data.playerNames);
                    }
                } catch (e) {}
            };

            useEffect(() => {
                const savedUrl = localStorage.getItem('gas_url');
                if (savedUrl) setUrl(savedUrl);
                fetchNames();
            }, []);

            const onGo = (u, m, p) => {
                setUrl(u);
                setMode(m);
                setPId(p);
                if (u) localStorage.setItem('gas_url', u);
            };

            const getApiUrl = (action, params = {}) => {
                if (isLocal) {
                    const searchParams = new URLSearchParams(params);
                    return `/api/${action}?${searchParams.toString()}`;
                }
                const searchParams = new URLSearchParams({ action, ...params });
                return `${url}?${searchParams.toString()}`;
            };

            const currentContestantName = (pId && playerNames && playerNames[pId - 1]) ? playerNames[pId - 1] : `المتسابق ${pId}`;

            return (
                <div className="min-h-screen flex flex-col text-studio-text">
                    <main className="flex-grow">
                        {mode === 'SETUP' && (
                            <SetupView
                                onGo={onGo}
                                isLocal={isLocal}
                                setIsLocal={setIsLocal}
                                url={url}
                                setUrl={setUrl}
                                playerNames={playerNames}
                            />
                        )}
                        {mode === 'ADMIN' && (
                            <div className="space-y-2">
                                <div className="px-6 pt-3 flex items-center justify-between text-xs text-studio-muted border-b border-white/5 pb-2">
                                    <div className="flex items-center gap-2">
                                        <span className="font-bold text-white">مسابقة مشكاة</span>
                                        <span>·</span>
                                        <span>غرفة المخرج</span>
                                    </div>
                                    <button
                                        onClick={() => { setMode('SETUP'); fetchNames(); }}
                                        className="text-xs text-studio-gold hover:underline cursor-pointer"
                                    >
                                        تبديل الواجهة ←
                                    </button>
                                </div>
                                <AdminView getApiUrl={getApiUrl} />
                            </div>
                        )}
                        {mode === 'PLAYER' && (
                            <div className="space-y-2">
                                <div className="px-6 pt-3 flex items-center justify-between text-xs text-studio-muted border-b border-white/5 pb-2">
                                    <div className="flex items-center gap-2">
                                        <span className="font-bold text-white">مسابقة مشكاة</span>
                                        <span>·</span>
                                        <span className="text-studio-gold">{currentContestantName}</span>
                                    </div>
                                    <button
                                        onClick={() => { setMode('SETUP'); fetchNames(); }}
                                        className="text-xs text-studio-muted hover:text-white cursor-pointer"
                                    >
                                        خروج
                                    </button>
                                </div>
                                <PlayerView getApiUrl={getApiUrl} playerId={pId} />
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
